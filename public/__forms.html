<!doctype html>
<html><head><meta charset="utf-8"><title>forms</title></head><body>
<!-- Static form definition so Netlify's build-time form detection registers it. The live form on / posts here by fetch. -->
<form name="signal" method="POST" data-netlify="true" netlify-honeypot="bot-field">
  <input type="hidden" name="form-name" value="signal">
  <input type="text" name="bot-field">
  <input type="text" name="name">
  <input type="email" name="email">
  <textarea name="message"></textarea>
</form>
</body></html>
